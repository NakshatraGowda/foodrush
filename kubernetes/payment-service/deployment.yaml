apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: nakshatragowda/payment-service:${BUILD_NUMBER}
          ports:
            - containerPort: 8083
          env:
            - name: POSTGRES_USER
              value: foodapp
            - name: POSTGRES_PASSWORD
              value: foodapp123
            - name: POSTGRES_DB
              value: payment_db