apiVersion: apps/v1
kind: Deployment
metadata:
  name: menu-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: menu-service
  template:
    metadata:
      labels:
        app: menu-service
    spec:
      containers:
        - name: menu-service
          image: nakshatragowda/menu-service:${BUILD_NUMBER}
          imagePullPolicy: Always
          ports:
            - containerPort: 8081
          env:
            - name: POSTGRES_USER
              value: foodapp
            - name: POSTGRES_PASSWORD
              value: foodapp123
            - name: POSTGRES_DB
              value: menu_db