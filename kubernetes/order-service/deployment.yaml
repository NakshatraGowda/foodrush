apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: nakshatragowda/order-service:${BUILD_NUMBER}
          ports:
            - containerPort: 8082
          env:
            - name: POSTGRES_USER
              value: foodapp
            - name: POSTGRES_PASSWORD
              value: foodapp123
            - name: POSTGRES_DB
              value: order_db