server:
  port: 8081

spring:
  application:
    name: menu-service
  datasource:
    url: jdbc:postgresql://postgres:5432/menu_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

logging:
  level:
    com.food.menu: DEBUG